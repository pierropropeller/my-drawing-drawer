name: Build debug APK

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.6"
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build debug APK
        env:
          # Google 登入用的 Web OAuth Client ID（GitHub Secret，沒設定時為空，登入功能會顯示尚未設定）
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID

      - name: Name APK
        id: apk
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "huakeng-debug-${{ github.run_number }}.apk"
          echo "path=huakeng-debug-${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Debug build ${{ github.run_number }}
          body: |
            Automated debug build from commit ${{ github.sha }} (branch `${{ github.ref_name }}`).
          files: ${{ steps.apk.outputs.path }}
